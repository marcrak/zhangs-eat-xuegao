<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>张雪峰的考研之路 🎓</title>
    <style>
        /* ================= 基础重置与现代化 UI 风格 ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* 防止移动端误触选中文字 */
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            /* 柔和的浅色渐变背景，保护视力且现代化 */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #333;
        }

        /* 游戏主容器，固定比例缩放 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px; /* 适配手机的经典宽度 */
            height: 100vh;
            max-height: 800px;
            background-color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ================= UI 层 ================= */
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            pointer-events: none; /* 让点击事件穿透到 Canvas */
            z-index: 10;
        }

        .stat-item {
            font-size: 16px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.85);
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.2s ease;
        }

        /* ================= 弹窗层 (胜利/失败) ================= */
        #modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: #fff;
            padding: 30px 20px;
            border-radius: 16px;
            text-align: center;
            width: 80%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .modal-desc {
            font-size: 16px;
            color: #666;
            margin-bottom: 25px;
        }

        .btn-restart {
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-restart:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(79, 172, 254, 0.4);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-layer">
        <div class="stat-item">🍦 已吃雪糕数：<span id="ui-icecream">0</span></div>
        <div class="stat-item">📚 集齐书本：<span id="ui-book">0</span> / 5</div>
        <div class="stat-item" style="color: #d32f2f;">🏃‍♂️ 误踩跑步机：<span id="ui-treadmill">0</span> (最多3次)</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="modal-overlay">
        <div class="modal-content">
            <div id="modal-title" class="modal-title">标题</div>
            <div id="modal-desc" class="modal-desc">描述</div>
            <button class="btn-restart" onclick="Game.restart()">🔄 重新开始</button>
        </div>
    </div>
</div>

<script>
    /**
     * ================= 游戏资源配置 =================
     * 遵循要求：统一使用相对路径名称，附带 Emoji 降级方案
     */
    const ASSETS = {
        hero: { src: 'hero.png', emoji: '👨‍🏫', img: new Image(), loaded: false, error: false },
        icecream: { src: 'icecream.png', emoji: '🍦', img: new Image(), loaded: false, error: false },
        book: { src: 'book.png', emoji: '📚', img: new Image(), loaded: false, error: false },
        treadmill: { src: 'treadmill.png', emoji: '🏃‍♂️', img: new Image(), loaded: false, error: false }
    };

    // 预加载图片资源，处理失败逻辑
    Object.values(ASSETS).forEach(asset => {
        asset.img.src = asset.src;
        asset.img.onload = () => asset.loaded = true;
        asset.img.onerror = () => {
            asset.error = true;
            console.warn(`[图片加载失败] ${asset.src}，已启用 Emoji 降级显示。`);
        };
    });

    /**
     * ================= 核心游戏引擎与状态 =================
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI 节点缓存
    const uiIcecream = document.getElementById('ui-icecream');
    const uiBook = document.getElementById('ui-book');
    const uiTreadmill = document.getElementById('ui-treadmill');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');

    // 响应式画布尺寸
    canvas.width = 450;
    canvas.height = 800;

    const Game = {
        state: 'START', // START, PLAYING, GAMEOVER, WIN
        animationId: null,
        
        // 玩家数据
        player: {
            w: 80, h: 80,
            x: canvas.width / 2 - 40,
            y: canvas.height - 100,
            speed: 6,
            dx: 0
        },

        // 掉落物数组
        items: [],
        
        // 游戏数值与进度
        stats: {
            icecream: 0,
            book: 0,
            treadmill: 0
        },

        // 控制生成的计时器与逻辑
        spawnTimer: 0,
        spawnInterval: 90, // 初始生成间隔(帧)
        nextBookMilestone: 10, // 下一次爆书所需的雪糕目标

        // 键盘按键状态
        keys: {
            left: false,
            right: false
        },

        init() {
            this.bindEvents();
            this.start();
        },

        start() {
            // 初始化数值
            this.state = 'PLAYING';
            this.player.x = canvas.width / 2 - this.player.w / 2;
            this.items = [];
            this.stats = { icecream: 0, book: 0, treadmill: 0 };
            this.spawnTimer = 0;
            this.spawnInterval = 90;
            this.nextBookMilestone = 10;
            
            modalOverlay.style.display = 'none';
            this.updateUI();
            this.loop();
        },

        restart() {
            cancelAnimationFrame(this.animationId);
            this.start();
        },

        end(type) {
            this.state = type; // 'WIN' 或 'GAMEOVER'
            cancelAnimationFrame(this.animationId);
            
            modalOverlay.style.display = 'flex';
            if (type === 'WIN') {
                modalTitle.innerHTML = '🎓 考研成功！上岸！';
                modalTitle.style.color = '#388e3c';
                modalDesc.innerHTML = `太棒了！你一共吃掉了 ${this.stats.icecream} 支雪糕，<br>成功集齐了 5 本考研秘籍！❤️`;
            } else {
                modalTitle.innerHTML = '💀 考研失败...';
                modalTitle.style.color = '#d32f2f';
                modalDesc.innerHTML = '回去踩跑步机吧！<br>你累计踩了 4 次跑步机，体力透支了。';
            }
        },

        // 生成掉落物
        spawnItem(forceType = null) {
            let type;
            if (forceType) {
                type = forceType;
            } else {
                // 基础掉落：80% 几率雪糕，20% 几率跑步机
                type = Math.random() < 0.2 ? 'treadmill' : 'icecream';
            }

            const w = 55;
            const h = 55;
            // 确保不会生成在屏幕外
            const x = Math.random() * (canvas.width - w);
            // 基础下落速度 3，随吃到雪糕数量略微提速
            const speed = 3 + Math.random() * 2 + (this.stats.icecream * 0.05);

            this.items.push({ type, x, y: -h, w, h, speed });
        },

        // 更新状态
        update() {
            if (this.state !== 'PLAYING') return;

            // 1. 玩家移动逻辑
            if (this.keys.left && this.player.x > 0) {
                this.player.x -= this.player.speed;
            }
            if (this.keys.right && this.player.x < canvas.width - this.player.w) {
                this.player.x += this.player.speed;
            }

            // 2. 掉落物生成逻辑
            this.spawnTimer++;
            if (this.spawnTimer > this.spawnInterval) {
                this.spawnItem();
                this.spawnTimer = 0;
                // 随时间慢慢增加难度（缩小生成间隔，最低 35 帧）
                if (this.spawnInterval > 35) {
                    this.spawnInterval -= 0.5;
                }
            }

            // 3. 掉落物更新与碰撞检测
            for (let i = this.items.length - 1; i >= 0; i--) {
                let item = this.items[i];
                item.y += item.speed;

                // 碰撞检测 AABB
                const isColliding = 
                    item.x < this.player.x + this.player.w - 15 &&  // 容差15px让碰撞更自然
                    item.x + item.w > this.player.x + 15 &&
                    item.y < this.player.y + this.player.h &&
                    item.y + item.h > this.player.y + 10;

                if (isColliding) {
                    this.handleCollision(item.type);
                    this.items.splice(i, 1); // 移除被吃掉的物体
                } else if (item.y > canvas.height) {
                    // 漏接判定：直接移除，不扣分
                    this.items.splice(i, 1);
                }
            }
        },

        // 处理碰撞（吃物机制）
        handleCollision(type) {
            if (type === 'icecream') {
                this.stats.icecream++;
                // 爆书机制：达到 10 的倍数时，仅生成一本考研名师书
                if (this.stats.icecream >= this.nextBookMilestone) {
                    this.spawnItem('book');
                    this.nextBookMilestone += 10; // 更新下一个目标
                }
            } else if (type === 'book') {
                this.stats.book++;
                if (this.stats.book >= 5) {
                    this.updateUI();
                    this.end('WIN');
                    return;
                }
            } else if (type === 'treadmill') {
                this.stats.treadmill++;
                // 超过 3 个（即接到第 4 个）触发 Game Over
                if (this.stats.treadmill >= 4) {
                    this.updateUI();
                    this.end('GAMEOVER');
                    return;
                }
            }
            this.updateUI();
        },

        // 更新左上角 UI
        updateUI() {
            uiIcecream.innerText = this.stats.icecream;
            uiBook.innerText = this.stats.book;
            uiTreadmill.innerText = this.stats.treadmill;
            
            // 加入简单的跳动动效
            uiIcecream.parentElement.style.transform = 'scale(1.1)';
            setTimeout(() => uiIcecream.parentElement.style.transform = 'scale(1)', 100);
        },

        // 绘制通用实体（支持图片降级）
        drawEntity(entity, assetKey) {
            const asset = ASSETS[assetKey];
            if (asset.loaded && !asset.error) {
                ctx.drawImage(asset.img, entity.x, entity.y, entity.w, entity.h);
            } else {
                // 图片加载失败或暂无：使用 Emoji 绘制
                ctx.font = `${entity.w * 0.8}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // 加点简单的投影让 Emoji 看起来更好看
                ctx.shadowColor = "rgba(0,0,0,0.2)";
                ctx.shadowBlur = 4;
                ctx.shadowOffsetY = 2;
                ctx.fillText(asset.emoji, entity.x + entity.w / 2, entity.y + entity.h / 2);
                ctx.shadowColor = "transparent"; // 重置阴影
            }
        },

        // 渲染画面
        render() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制玩家 (张雪峰)
            this.drawEntity(this.player, 'hero');

            // 绘制掉落物
            this.items.forEach(item => {
                this.drawEntity(item, item.type); // type 刚好对应 ASSETS 的 key
            });
        },

        // 主循环
        loop() {
            Game.update();
            Game.render();
            if (Game.state === 'PLAYING') {
                Game.animationId = requestAnimationFrame(() => Game.loop());
            }
        },

        // 事件绑定 (键盘与触摸)
        bindEvents() {
            // ----- 键盘事件 (PC) -----
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') this.keys.left = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') this.keys.right = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') this.keys.left = false;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') this.keys.right = false;
            });

            // ----- 触屏事件 (移动端) -----
            // 实现手指跟随：直接映射触控点 X 坐标到玩家中心点，实现丝滑拖拽
            const handleTouch = (e) => {
                e.preventDefault(); // 阻止浏览器默认滚动
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                // 计算实际缩放比
                const scaleX = canvas.width / rect.width;
                // 计算在 Canvas 坐标系下的 X 位置，并居中角色
                let touchX = (touch.clientX - rect.left) * scaleX;
                
                let targetX = touchX - this.player.w / 2;
                // 边界限制
                if (targetX < 0) targetX = 0;
                if (targetX > canvas.width - this.player.w) targetX = canvas.width - this.player.w;
                
                this.player.x = targetX;
            };

            canvas.addEventListener('touchstart', handleTouch, { passive: false });
            canvas.addEventListener('touchmove', handleTouch, { passive: false });
        }
    };

    // 启动游戏
    window.onload = () => {
        Game.init();
    };

</script>
</body>
</html>
